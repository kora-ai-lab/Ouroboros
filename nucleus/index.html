<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ouroboros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --black: #0A0A0A;
      --surface: #111111;
      --white: #FFFFFF;
      --gray-1: #1A1A1A;
      --gray-2: #222222;
      --gray-3: #6B6B6B;
      --gray-4: #ABABAB;
      --gray-5: #333333;
      --mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
      --sidebar-w: 280px;
      --topbar-h: 56px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select { font: inherit; border-radius: 0; }

    /* ── LAYOUT ── */
    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      height: 100vh;
      overflow: hidden;
    }

    .app.sidebar-collapsed { grid-template-columns: 0 1fr; }
    .app.sidebar-collapsed .sidebar { transform: translateX(calc(-1 * var(--sidebar-w))); opacity: 0; pointer-events: none; }

    /* ── SIDEBAR (left) ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--gray-2);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      height: 100vh;
      overflow: hidden;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .sidebar-header {
      padding: 16px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--gray-2);
    }

    .sidebar-header .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gray-4);
    }

    .sidebar-actions {
      display: grid;
      gap: 4px;
      padding: 12px 12px 8px;
    }

    .sidebar-actions button {
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      font-size: 13px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--gray-4);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }

    .sidebar-actions button:hover {
      background: var(--gray-1);
      color: var(--white);
    }

    .sidebar-scroll {
      overflow-y: auto;
      padding: 0 12px 12px;
    }

    .section-title {
      color: var(--gray-3);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 16px 0 8px 4px;
    }

    .memory-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--gray-4);
      cursor: pointer;
      font-size: 12px;
      line-height: 1.45;
      transition: background 0.12s, border-color 0.12s;
      width: 100%;
      text-align: left;
    }

    .memory-item:hover { background: var(--gray-1); border-color: var(--gray-2); }
    .memory-item.active { border-color: var(--gray-3); color: var(--white); background: var(--gray-1); }

    .memory-item strong {
      display: block;
      color: var(--white);
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    /* ── MAIN ── */
    .main {
      display: grid;
      grid-template-rows: var(--topbar-h) 1fr auto;
      height: 100vh;
      min-width: 0;
      overflow: hidden;
    }

    /* ── TOPBAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--gray-2);
      background: var(--black);
      height: var(--topbar-h);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-left .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .sidebar-toggle {
      background: none;
      border: 1px solid var(--gray-2);
      color: var(--gray-4);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      padding: 0;
      min-height: 0;
      transition: color 0.12s, border-color 0.12s;
    }

    .sidebar-toggle:hover { color: var(--white); border-color: var(--gray-3); }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .controls select {
      background: var(--gray-1);
      border: 1px solid var(--gray-2);
      color: var(--white);
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      min-height: 0;
      height: 36px;
    }

    .controls button {
      background: var(--gray-1);
      border: 1px solid var(--gray-2);
      color: var(--gray-4);
      padding: 7px 14px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      min-height: 0;
      height: 36px;
      transition: color 0.12s, background 0.12s;
    }

    .controls button:hover { background: var(--gray-2); color: var(--white); }

    /* ── TOGGLE ── */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--gray-3);
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .toggle-switch {
      position: relative;
      width: 32px;
      height: 18px;
      cursor: pointer;
    }

    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--gray-2);
      border: 1px solid var(--gray-3);
      transition: background 0.15s, border-color 0.15s;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      background: var(--gray-4);
      transition: transform 0.15s, background 0.15s;
    }

    .toggle-switch input:checked + .toggle-track {
      background: var(--white);
      border-color: var(--white);
    }

    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(14px);
      background: var(--black);
    }

    .toggle-label-auto {
      color: var(--gray-3);
      transition: color 0.15s;
    }

    .toggle-label-auto.active {
      color: var(--white);
      font-weight: 700;
    }

    /* ── OUTPUT ── */
    .output {
      overflow-y: auto;
      padding: 24px 32px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 780px;
      margin: 0 auto 20px;
      padding: 16px 20px;
      border-left: 2px solid var(--gray-2);
      background: transparent;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.65;
      font-size: 14px;
      animation: msgIn 0.2s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user-msg { border-left-color: var(--gray-3); }
    .message.assistant-msg { border-left-color: var(--white); }
    .message.system-msg { border-left-color: var(--gray-5); }
    .message.tool-msg { border-left-color: var(--gray-3); background: var(--surface); }
    .message.task-msg { border-left-color: var(--gray-4); background: var(--surface); font-size: 13px; }
    .message.task-msg .content { color: var(--gray-4); }
    .message.approval-msg { border-left-color: var(--white); border: 1px solid var(--gray-3); background: var(--surface); }

    .mv-node { padding: 3px 0 3px 16px; font-size: 12px; cursor: pointer; color: var(--gray-4); }
    .mv-node:hover { color: var(--white); }
    .mv-node .mv-icon { display:inline-block; width:16px; text-align:center; margin-right:4px; }
    .mv-node .mv-label { color: var(--gray-3); font-size:10px; margin-left:4px; }
    .mv-node.mv-ok { color: var(--gray-4); }
    .mv-node.mv-run { color: var(--white); }
    .mv-node.mv-fail { color: #ff6b6b; }
    .mv-node.mv-pend { color: var(--gray-5); }
    .mv-children { margin-left: 0; }
    .mv-node[data-level="the_one"] { font-weight:700; color:var(--white); font-size:13px; border-bottom:1px solid var(--gray-3); padding-bottom:6px; margin-bottom:6px; }

    .role {
      color: var(--gray-3);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .message.assistant-msg .role { color: var(--gray-4); }

    /* ── COMPOSER ── */
    .composer-area {
      border-top: 1px solid var(--gray-2);
      background: var(--black);
      padding: 16px 32px 20px;
    }

    .context-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--gray-2);
      padding: 4px 10px;
      color: var(--gray-4);
      background: var(--gray-1);
      white-space: nowrap;
      font-size: 11px;
      cursor: pointer;
      transition: border-color 0.12s;
    }

    .chip:hover { border-color: var(--gray-3); color: var(--white); }

    .composer {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .file-label {
      border: 1px solid var(--gray-2);
      background: var(--gray-1);
      color: var(--gray-3);
      padding: 10px 14px;
      cursor: pointer;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      height: 44px;
      display: flex;
      align-items: center;
      transition: color 0.12s;
    }

    .file-label:hover { color: var(--white); }

    input[type="file"] { display: none; }

    textarea {
      width: 100%;
      min-height: 44px;
      max-height: 200px;
      resize: none;
      border: 1px solid var(--gray-2);
      background: var(--surface);
      color: var(--white);
      padding: 10px 14px;
      outline: none;
      font-size: 14px;
      line-height: 1.5;
      transition: border-color 0.12s;
    }

    textarea:focus { border-color: var(--gray-3); }

    #send {
      background: var(--white);
      color: var(--black);
      border: none;
      padding: 10px 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      height: 44px;
      transition: opacity 0.12s;
    }

    #send:hover { opacity: 0.85; }
    #send:disabled { opacity: 0.3; cursor: not-allowed; }

    .status {
      color: var(--gray-3);
      font-size: 11px;
      padding: 6px 0 0;
      min-height: 20px;
      letter-spacing: 0.3px;
    }

    /* ── JSON blocks ── */
    .json-toggle {
      cursor: pointer;
      user-select: none;
      padding: 6px 10px;
      margin: 8px 0 0;
      font-size: 11px;
      font-family: var(--mono);
      color: var(--gray-3);
      background: var(--gray-1);
      border: 1px solid var(--gray-2);
      transition: color 0.12s;
    }

    .json-toggle:hover { color: var(--gray-4); }

    .json-pre {
      font-size: 11px;
      font-family: var(--mono);
      margin: 0;
      padding: 8px 10px;
      border: 1px solid var(--gray-2);
      border-top: none;
      background: var(--gray-1);
      overflow-x: auto;
      line-height: 1.5;
      color: var(--gray-4);
    }

    /* ── INPUTS ── */
    input[type="password"],
    input[type="text"],
    input[type="number"] {
      width: 100%;
      border: 1px solid var(--gray-2);
      background: var(--surface);
      color: var(--white);
      padding: 9px 12px;
      outline: none;
      font-size: 13px;
      transition: border-color 0.12s;
    }

    input:focus { border-color: var(--gray-3); }

    button:not(#send),
    select {
      border: 1px solid var(--gray-2);
      background: var(--gray-1);
      color: var(--white);
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    button:not(#send):hover,
    select:hover {
      background: var(--gray-2);
    }

    button:disabled {
      color: var(--gray-3);
      cursor: not-allowed;
    }

    /* ── SETTINGS PANEL ── */
    .settings-panel {
      position: fixed;
      inset: 0;
      display: none;
      align-items: stretch;
      justify-content: flex-end;
      background: rgba(10, 10, 10, 0.82);
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    .settings-panel.open { display: flex; }

    .settings-content {
      width: min(480px, 100vw);
      height: 100vh;
      background: var(--black);
      border-left: 1px solid var(--gray-2);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .settings-body {
      overflow-y: auto;
      padding: 16px;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .field { display: grid; gap: 6px; }

    .field label {
      color: var(--gray-3);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .provider-card {
      border: 1px solid var(--gray-2);
      padding: 14px;
      display: grid;
      gap: 12px;
      background: var(--surface);
    }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .help-text {
      color: var(--gray-3);
      font-size: 11px;
      line-height: 1.5;
    }

    .check-field {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gray-4);
      font-size: 12px;
      text-transform: uppercase;
    }

    .sidebar-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin: 0;
    }

    .sidebar-controls button:first-child { grid-column: 1 / -1; }

    /* ── RESPONSIVE ── */
    @media (max-width: 760px) {
      :root { --sidebar-w: 240px; }
      .app { grid-template-columns: 1fr; }
      .app.sidebar-collapsed .sidebar { transform: translateX(-100%); }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: var(--sidebar-w);
        z-index: 20;
      }
      .output { padding: 16px; }
      .composer-area { padding: 12px 16px 16px; }
      .composer { grid-template-columns: 1fr auto; }
      .file-label { display: none; }
    }
  </style>
</head>
<body>
  <div class="app sidebar-collapsed">
    <aside id="memorySidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand">Ouroboros</div>
        <button id="refreshMemory" type="button" style="padding:4px 10px;font-size:11px;min-height:0;height:28px;">Refresh</button>
      </div>
      <div class="sidebar-actions">
        <button id="newSession" type="button">New session</button>
        <button id="previousSession" type="button">Previous session</button>
        <button id="nextSession" type="button">Next session</button>
        <button id="saveSession" type="button">Save to memory</button>
      </div>
      <div class="sidebar-scroll">
        <div class="section-title">Threads</div>
        <div id="sessionList"></div>
        <div class="section-title">Episodic Memory</div>
        <div id="memoryList"></div>
        <div class="section-title" style="cursor:pointer;user-select:none" id="multiverseToggle">Multivers ▸</div>
        <div id="multiversePanel" style="display:none"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="toggleMemory" type="button" class="sidebar-toggle" title="Toggle sidebar">&#9776;</button>
          <div class="brand">Ouroboros</div>
        </div>
        <div class="controls">
          <div class="toggle-row">
            <span>Manual</span>
            <label class="toggle-switch">
              <input id="autoApproveToggle" type="checkbox">
              <span class="toggle-track"></span>
            </label>
            <span id="autoApproveLabel" class="toggle-label-auto">Auto</span>
          </div>
          <button id="openSettings" type="button">Settings</button>
          <select id="model">
            <option value="openai-fast">openai-fast</option>
            <option value="qwen-coder">qwen-coder</option>
            <option value="deepseek">deepseek</option>
            <option value="claude-fast">claude-fast</option>
            <option value="claude">claude</option>
            <option value="nova-fast">nova-fast</option>
            <option value="searchgpt">searchgpt</option>
            <option value="mistral">mistral</option>
          </select>
        </div>
      </header>

      <section id="output" class="output" aria-live="polite">
        <div class="message system-msg">
          <div class="role">System</div>
          Ouroboros nucleus is ready.
        </div>
      </section>

      <section class="composer-area">
        <div id="contextStrip" class="context-strip"></div>
        <form id="composer" class="composer">
          <label class="file-label" for="fileInput">+ File</label>
          <input id="fileInput" type="file">
          <textarea id="prompt" placeholder="Message Ouroboros..." rows="1"></textarea>
          <button id="send" type="submit">Send</button>
        </form>
        <div id="status" class="status"></div>
      </section>
    </main>
  </div>

  <section id="settingsPanel" class="settings-panel" aria-hidden="true">
    <form id="settingsForm" class="settings-content">
      <header class="topbar">
        <div class="brand">Settings</div>
        <button id="closeSettings" type="button">Close</button>
      </header>
      <div class="settings-body">
        <div class="field">
          <label for="provider">Provider</label>
          <select id="provider"></select>
        </div>
        <div class="field">
          <label for="settingsModel">Default model</label>
          <select id="settingsModel"></select>
        </div>
        <div id="providerSettings"></div>
        <div class="provider-card">
          <div class="brand">Local models</div>
          <div class="field">
            <label for="localModelRoot">Optional folder</label>
            <input id="localModelRoot" type="text" placeholder="C:\models">
          </div>
          <div class="actions">
            <button id="scanLocalModels" type="button">Scan computer</button>
          </div>
          <div id="localModelRoots" class="status"></div>
          <div id="localModelList"></div>
        </div>
        <div class="provider-card">
          <div class="brand">Add provider</div>
          <div class="field">
            <label for="newProviderId">Provider id</label>
            <input id="newProviderId" type="text" placeholder="ollama">
          </div>
          <div class="field">
            <label for="newProviderLabel">Label</label>
            <input id="newProviderLabel" type="text" placeholder="Ollama">
          </div>
          <div class="field">
            <label for="newProviderType">Type</label>
            <select id="newProviderType">
              <option value="openai_compatible">OpenAI compatible</option>
              <option value="ollama">Ollama</option>
              <option value="gguf">Local GGUF folder</option>
            </select>
          </div>
          <div class="field">
            <label for="newProviderBaseUrl">Base URL</label>
            <input id="newProviderBaseUrl" type="text" placeholder="http://127.0.0.1:11434">
          </div>
          <div class="field">
            <label for="newProviderModels">Models</label>
            <input id="newProviderModels" type="text" placeholder="model-a, model-b">
          </div>
          <div class="field">
            <label for="newProviderModelsPath">GGUF folder</label>
            <input id="newProviderModelsPath" type="text" placeholder="C:\models">
          </div>
          <div class="field">
            <label for="newProviderKey">API key</label>
            <input id="newProviderKey" type="password" autocomplete="off" placeholder="Optional">
          </div>
          <div class="actions">
            <button id="saveProvider" type="button">Save provider</button>
          </div>
        </div>
        <div class="status" id="settingsStatus"></div>
      </div>
      <footer class="composer">
        <button type="submit">Save settings</button>
      </footer>
    </form>
  </section>

  <script>
    const output = document.getElementById('output');
    const composer = document.getElementById('composer');
    const promptInput = document.getElementById('prompt');
    const sendButton = document.getElementById('send');
    const modelSelect = document.getElementById('model');
    const statusNode = document.getElementById('status');
    const fileInput = document.getElementById('fileInput');
    const contextStrip = document.getElementById('contextStrip');
    const memoryList = document.getElementById('memoryList');
    const sessionList = document.getElementById('sessionList');
    const memorySidebar = document.getElementById('memorySidebar');
    const toggleMemory = document.getElementById('toggleMemory');
    const saveSession = document.getElementById('saveSession');
    const refreshMemory = document.getElementById('refreshMemory');
    const newSessionButton = document.getElementById('newSession');
    const previousSessionButton = document.getElementById('previousSession');
    const nextSessionButton = document.getElementById('nextSession');
    const openSettings = document.getElementById('openSettings');
    const closeSettings = document.getElementById('closeSettings');
    const settingsPanel = document.getElementById('settingsPanel');
    const settingsForm = document.getElementById('settingsForm');
    const providerSelect = document.getElementById('provider');
    const settingsModelSelect = document.getElementById('settingsModel');
    const providerSettings = document.getElementById('providerSettings');
    const settingsStatus = document.getElementById('settingsStatus');
    const saveProviderButton = document.getElementById('saveProvider');
    const scanLocalModelsButton = document.getElementById('scanLocalModels');
    const localModelRoots = document.getElementById('localModelRoots');
    const localModelList = document.getElementById('localModelList');
    const localModelRoot = document.getElementById('localModelRoot');
    const newProviderId = document.getElementById('newProviderId');
    const newProviderLabel = document.getElementById('newProviderLabel');
    const newProviderType = document.getElementById('newProviderType');
    const newProviderBaseUrl = document.getElementById('newProviderBaseUrl');
    const newProviderModels = document.getElementById('newProviderModels');
    const newProviderModelsPath = document.getElementById('newProviderModelsPath');
    const newProviderKey = document.getElementById('newProviderKey');
    const autoApproveToggle = document.getElementById('autoApproveToggle');
    const autoApproveLabel = document.getElementById('autoApproveLabel');

    autoApproveToggle.addEventListener('change', () => {
      autoApproveLabel.classList.toggle('active', autoApproveToggle.checked);
    });

    const messages = [];
    const contextFiles = [];
    let settingsState = null;
    let activeSessionId = null;
    let sessionRecords = [];
    let currentChatAbort = null;

    const LOCAL_RUNTIME_PRESETS = {
      safe: { n_threads: 4, n_gpu_layers: 0, n_ctx: 2048, n_batch: 256, n_ubatch: 256, use_mmap: true, use_mlock: false, flash_attn: false },
      balanced: { n_threads: Math.max((navigator.hardwareConcurrency || 6) - 1, 1), n_gpu_layers: 0, n_ctx: 4096, n_batch: 512, n_ubatch: 512, use_mmap: true, use_mlock: false, flash_attn: false },
      turbo_cpu: { n_threads: navigator.hardwareConcurrency || 8, n_gpu_layers: 0, n_ctx: 4096, n_batch: 1024, n_ubatch: 512, use_mmap: true, use_mlock: true, flash_attn: false },
      turbo_gpu: { n_threads: Math.max(Math.floor((navigator.hardwareConcurrency || 8) / 2), 1), n_gpu_layers: 999, n_ctx: 8192, n_batch: 1024, n_ubatch: 512, use_mmap: true, use_mlock: true, flash_attn: true }
    };

    function setStatus(text) {
      statusNode.textContent = text;
    }

    function msgClass(role) {
      const r = role.toLowerCase();
      if (r === 'user') return 'user-msg';
      if (r === 'ouroboros' || r === 'assistant') return 'assistant-msg';
      if (r === 'system') return 'system-msg';
      if (r.includes('task')) return 'task-msg';
      if (r.includes('tool')) return 'tool-msg';
      return '';
    }

    function addMessage(role, html) {
      const node = document.createElement('div');
      node.className = `message ${msgClass(role)}`;
      node.innerHTML = `<div class="role">${role}</div><div class="content">${html}</div>`;
      output.appendChild(node);
      output.scrollTop = output.scrollHeight;
      return node.querySelector('.content');
    }

    function addTextMessage(role, text) {
      const node = document.createElement('div');
      node.className = `message ${msgClass(role)}`;
      const roleNode = document.createElement('div');
      roleNode.className = 'role';
      roleNode.textContent = role;
      const contentNode = document.createElement('div');
      contentNode.className = 'content';
      contentNode.textContent = text;
      node.appendChild(roleNode);
      node.appendChild(contentNode);
      output.appendChild(node);
      output.scrollTop = output.scrollHeight;
      return contentNode;
    }

    function renderJsonBlock(role, data) {
      const id = 'jb-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
      const content = JSON.stringify(data, null, 2);
      const escaped = content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const html =
        '<div class="json-toggle" data-target="' + id + '">' +
        '[\u002B] <span style="color:var(--gray-3)">raw</span>' +
        '</div><pre id="' + id + '" class="json-pre" style="display:none">' +
        escaped + '</pre>';
      addMessage(role, html);
    }

    const TASK_EVENT_LABELS = {
      task_started: 'Task started',
      task_plan: 'Task plan',
      task_step: 'Task step',
      task_observation: 'Task observation',
      task_evaluation: 'Task evaluation',
      task_retry: 'Task retry',
      task_checkpoint: 'Task checkpoint',
      task_done: 'Task done'
    };

    function describeTaskEvent(eventName, data) {
      if (eventName === 'task_started') {
        const parts = ['stream opened'];
        if (data.provider) parts.push(`provider: ${data.provider}`);
        if (data.model) parts.push(`model: ${data.model}`);
        return parts.join(' · ');
      }
      if (eventName === 'task_plan') {
        const steps = Array.isArray(data.steps) ? data.steps.join(' → ') : 'No plan details provided';
        return `${steps}${data.max_attempts ? ` (max attempts: ${data.max_attempts})` : ''}`;
      }
      if (eventName === 'task_step') {
        const parts = [data.step || 'step'];
        if (data.tool_name) parts.push(`tool: ${data.tool_name}`);
        if (data.model) parts.push(`model: ${data.model}`);
        if (data.attempt) parts.push(`attempt: ${data.attempt}`);
        return parts.join(' · ');
      }
      if (eventName === 'task_observation') {
        const parts = [data.observation || 'observation'];
        if (Number.isFinite(data.tool_call_count)) parts.push(`tool calls: ${data.tool_call_count}`);
        if (data.tool_name) parts.push(`tool: ${data.tool_name}`);
        if (data.content_length) parts.push(`${data.content_length} chars`);
        return parts.join(' · ');
      }
      if (eventName === 'task_evaluation') {
        return `${data.status || 'evaluated'} · tool calls: ${data.tool_call_count || 0}`;
      }
      if (eventName === 'task_retry') {
        return `${data.reason || 'retry requested'}${data.next_step ? ` → ${data.next_step}` : ''}`;
      }
      if (eventName === 'task_checkpoint') {
        return `${data.checkpoint || 'checkpoint'}${data.tool_name ? ` · tool: ${data.tool_name}` : ''}`;
      }
      if (eventName === 'task_done') {
        return data.status || 'complete';
      }
      return data.message || data.status || JSON.stringify(data);
    }

    function renderTaskEvent(eventName, data) {
      const node = document.createElement('div');
      node.className = 'message task-msg';
      const role = document.createElement('div');
      role.className = 'role';
      role.textContent = TASK_EVENT_LABELS[eventName] || eventName;
      const content = document.createElement('div');
      content.className = 'content';
      content.textContent = describeTaskEvent(eventName, data || {});
      node.append(role, content);
      output.appendChild(node);
      output.scrollTop = output.scrollHeight;
    }

    function addChip(item) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = item.name;
      chip.addEventListener('click', () => {
        const index = contextFiles.indexOf(item);
        if (index >= 0) {
          contextFiles.splice(index, 1);
          chip.remove();
        }
      });
      contextStrip.appendChild(chip);
    }

    function createSessionId() {
      return `session-${Date.now()}`;
    }

    function stripToolCalls(text) {
      return text.replace(/<tool_call>[\s\S]*?(?:<\/tool_call>|$)/g, '');
    }

    function renderLoadedMessages(loadedMessages) {
      messages.length = 0;
      output.innerHTML = '';
      for (const m of loadedMessages) {
        messages.push(m);
        if (m.role === 'user') addTextMessage('User', m.content);
        else if (m.role === 'assistant') addTextMessage('Ouroboros', stripToolCalls(m.content));
        else if (m.role === 'system') addTextMessage('System', m.content);
        else if (m.role === 'tool') {
          const toolId = 'tl-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
          const escaped = m.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          addMessage('Tool result',
            '<div class="json-toggle" data-target="' + toolId + '">' +
            '[\u002B] <span style="color:var(--gray-3)">raw</span></div>' +
            '<pre id="' + toolId + '" class="json-pre" style="display:none">' +
            escaped + '</pre>');
        }
      }
      if (!loadedMessages.length) addTextMessage('System', 'New session started.');
    }

    function startNewSession(showStatus = true) {
      activeSessionId = createSessionId();
      renderLoadedMessages([]);
      if (showStatus) setStatus(`New session: ${activeSessionId}`);
      refreshSessions();
      return activeSessionId;
    }

    async function persistSessionArchive(statusText = '') {
      if (!activeSessionId) activeSessionId = createSessionId();
      if (!messages.length) return;
      const response = await fetch(`/sessions/${activeSessionId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });
      if (!response.ok) throw new Error(await response.text());
      if (statusText) setStatus(statusText);
      await refreshSessions();
    }

    async function loadSession(sessionId, confirmReplace = true) {
      if (currentChatAbort) {
        currentChatAbort.abort();
        currentChatAbort = null;
      }
      if (confirmReplace && messages.length && !confirm('Replace current chat with this session?')) return;
      const res = await fetch(`/sessions/${sessionId}`);
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      activeSessionId = data.session_id;
      renderLoadedMessages(data.messages || []);
      setStatus(`Loaded session: ${activeSessionId}`);
      await refreshSessions();
    }

    function currentSessionIndex() {
      return sessionRecords.findIndex(session => session.session_id === activeSessionId);
    }

    async function navigateSession(direction) {
      if (!sessionRecords.length) {
        setStatus('No saved sessions yet.');
        return;
      }
      const current = currentSessionIndex();
      const nextIndex = current < 0
        ? 0
        : Math.min(Math.max(current + direction, 0), sessionRecords.length - 1);
      const target = sessionRecords[nextIndex];
      if (target) await loadSession(target.session_id, true);
    }

    async function refreshSessions() {
      try {
        const response = await fetch('/sessions');
        const data = await response.json();
        sessionRecords = data.sessions || [];
        sessionList.innerHTML = '';
        for (const session of sessionRecords) {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = `memory-item${session.session_id === activeSessionId ? ' active' : ''}`;
          const updated = new Date(session.updated_at).toLocaleString();
          const summary = session.summary || session.session_id;
          item.innerHTML = `<strong>${session.title || session.session_id}</strong><span style="font-size:10px;color:var(--gray-3);display:block;margin-bottom:6px;">${updated}</span><span style="color:var(--gray-4);line-height:1.4;">${summary.length > 100 ? summary.substring(0, 100) + '...' : summary}</span>`;
          item.addEventListener('click', async () => {
            try {
              await loadSession(session.session_id, true);
            } catch (err) {
              setStatus(`Load failed: ${err.message}`);
            }
          });
          sessionList.appendChild(item);
        }
        if (!sessionList.children.length) {
          sessionList.innerHTML = '<div class="memory-item">No saved conversation threads yet.</div>';
        }
      } catch (e) {
        sessionList.innerHTML = `<div class="memory-item">Failed to load sessions: ${e.message}</div>`;
      }
    }

    async function refreshMemories() {
      await refreshSessions();
      try {
        const response = await fetch('/memory');
        const data = await response.json();
        memoryList.innerHTML = '';
        for (const memory of data.memories || []) {
          const item = document.createElement('div');
          item.className = 'memory-item';
          
          const created = document.createElement('div');
          created.style.fontSize = '10px';
          created.style.color = 'var(--gray-3)';
          created.style.marginBottom = '6px';
          created.textContent = new Date(memory.created_at).toLocaleString();
          
          const summary = document.createElement('div');
          summary.style.color = 'var(--gray-4)';
          summary.style.lineHeight = '1.4';
          summary.textContent = memory.summary.length > 100 ? memory.summary.substring(0, 100) + '...' : memory.summary;
          
          item.appendChild(created);
          item.appendChild(summary);
          
          item.addEventListener('click', () => {
            const contextItem = { type: 'memory', name: `memory-${memory.id}`, content: memory.summary };
            if (!contextFiles.some(f => f.name === contextItem.name)) {
              contextFiles.push(contextItem);
              addChip(contextItem);
            }
            
            const contentNode = addMessage('System', `Memory preview: ${memory.id}<br>`);
            const node = document.createElement('div');
            node.innerHTML = `<div style="border-left:2px solid var(--gray-3);padding-left:12px;margin-top:8px;font-family:monospace;white-space:pre-wrap;">${memory.summary}</div>`;
            contentNode.appendChild(node);
          });

          const loadBtn = document.createElement('button');
          loadBtn.type = 'button';
          loadBtn.className = 'chip';
          loadBtn.style.marginTop = '8px';
          loadBtn.style.width = '100%';
          loadBtn.style.textAlign = 'center';
          loadBtn.textContent = 'Load thread';
          loadBtn.onclick = async (e) => {
            e.stopPropagation();
            try {
              await loadSession(memory.session_id, true);
            } catch (err) {
              setStatus(`Load failed: ${err.message}`);
            }
          };
          item.appendChild(loadBtn);

          memoryList.appendChild(item);
        }
        if (!memoryList.children.length) {
          memoryList.innerHTML = '<div class="memory-item">No episodic memories yet.</div>';
        }
      } catch (e) {
        memoryList.innerHTML = `<div class="memory-item">Failed to load memories: ${e.message}</div>`;
      }
    }

    const LEVEL_ICONS = {
      'the_one': '◆', 'universe_god': '◆', 'galaxy_demigod': '✦', 'system_god': '●',
      'world_monarch': '◉', 'continent_emperor': '▸', 'country_president': '▹',
      'info': '·', 'done': '✓', 'running': '◌', 'failed': '✗', 'active': '●', 'error': '⚠',
      'artifact': '📄', 'denial': '⊘',
    };
    function renderTree(node, depth) {
      if (!node) return '';
      const icon = LEVEL_ICONS[node.level] || '·';
      const status = node.status === 'running' ? 'mv-run' : node.status === 'done' || node.status === 'completed' ? 'mv-ok' : node.status === 'error' || node.status === 'failed' ? 'mv-fail' : '';
      const kids = node.children || [];
      const hasKids = kids.length > 0;
      const padding = depth * 16;
      let label = node.title || '';
      if (node.level === 'the_one') label = '◆ The One (Ouroboros)';
      let html = `<div class="mv-node ${status}" style="padding-left:${padding}px" data-depth="${depth}" data-level="${node.level}">`;
      html += `<span class="mv-icon">${hasKids ? '▾' : '·'}</span> ${label}`;
      if (node.level === 'the_one') {
        const total = countDescendants(node);
        html += ` <span class="mv-label">${total} descendants · Overseer of All</span>`;
      }
      if (node.task_id) html += ` <span class="mv-label" style="cursor:pointer" data-task="${node.task_id}">[details]</span>`;
      html += '</div>';
      if (hasKids) {
        html += '<div class="mv-children">';
        for (const kid of kids) {
          html += renderTree(kid, depth + 1);
        }
        html += '</div>';
      }
      return html;
    }
    function countDescendants(node) {
      let n = 0;
      for (const c of (node.children || [])) { n += 1 + countDescendants(c); }
      return n;
    }

    async function refreshMultiverse() {
      const panel = document.getElementById('multiversePanel');
      if (panel.style.display === 'none') return;
      try {
        const res = await fetch('/multiverse');
        const tree = await res.json();
        panel.innerHTML = renderTree(tree, 0);
        panel.querySelectorAll('[data-task]').forEach(el => {
          el.addEventListener('click', async (e) => {
            e.stopPropagation();
            const taskId = el.dataset.task;
            setStatus(`Loading task ${taskId}...`);
            try {
              const r = await fetch(`/sessions/${taskId}`);
              if (r.ok) await loadSession(taskId, true);
              else setStatus(`Task ${taskId}: ${r.status}`);
            } catch (err) { setStatus(err.message); }
          });
        });
      } catch (e) {
        panel.innerHTML = `<div style="padding:8px;font-size:12px;color:var(--gray-5)">${e.message}</div>`;
      }
    }

    document.getElementById('multiverseToggle').addEventListener('click', () => {
      const panel = document.getElementById('multiversePanel');
      const toggle = document.getElementById('multiverseToggle');
      const shown = panel.style.display !== 'none';
      panel.style.display = shown ? 'none' : 'block';
      toggle.textContent = shown ? 'Multivers ▸' : 'Multivers ▾';
      if (!shown) refreshMultiverse();
    });

    function setSettingsStatus(text) {
      settingsStatus.textContent = text;
    }

    function rebuildModelOptions(select, models, selected) {
      select.innerHTML = '';
      for (const model of models) {
        const option = document.createElement('option');
        option.value = model;
        option.textContent = model;
        if (model === selected) option.selected = true;
        select.appendChild(option);
      }
    }

    function runtimeSettingsHtml(provider) {
      if (!['gguf', 'ollama'].includes(provider.type)) return '';
      const runtime = provider.runtime_settings || {};
      const value = (key, fallback) => runtime[key] ?? fallback;
      const checked = (key, fallback) => value(key, fallback) ? 'checked' : '';
      return `
        <div class="field">
          <label>Performance preset</label>
          <div class="actions">
            <button type="button" data-runtime-preset="safe">Safe</button>
            <button type="button" data-runtime-preset="balanced">Balanced</button>
            <button type="button" data-runtime-preset="turbo_cpu">Turbo CPU</button>
            <button type="button" data-runtime-preset="turbo_gpu">Turbo GPU</button>
          </div>
        </div>
        <div class="field-grid">
          <div class="field">
            <label for="runtimeNThreads">n_threads</label>
            <input id="runtimeNThreads" type="number" min="1" value="${value('n_threads', 4)}">
          </div>
          <div class="field">
            <label for="runtimeNGpuLayers">n_gpu_layers</label>
            <input id="runtimeNGpuLayers" type="number" min="0" value="${value('n_gpu_layers', 0)}">
          </div>
          <div class="field">
            <label for="runtimeNCtx">n_ctx</label>
            <input id="runtimeNCtx" type="number" min="512" step="512" value="${value('n_ctx', 4096)}">
          </div>
          <div class="field">
            <label for="runtimeNBatch">n_batch</label>
            <input id="runtimeNBatch" type="number" min="1" value="${value('n_batch', 512)}">
          </div>
          <div class="field">
            <label for="runtimeNUbatch">n_ubatch</label>
            <input id="runtimeNUbatch" type="number" min="1" value="${value('n_ubatch', 512)}">
          </div>
        </div>
        <div class="actions">
          <label class="check-field"><input id="runtimeUseMmap" type="checkbox" ${checked('use_mmap', true)}> use_mmap</label>
          <label class="check-field"><input id="runtimeUseMlock" type="checkbox" ${checked('use_mlock', false)}> use_mlock</label>
          <label class="check-field"><input id="runtimeFlashAttn" type="checkbox" ${checked('flash_attn', false)}> flash_attn</label>
        </div>
        <div class="help-text">
          Quant guidance: smaller/faster models use Q4_K_M or Q4_0; balanced models use Q5_K_M; higher quality/slower models use Q6_K or Q8_0.
        </div>
      `;
    }

    function applyRuntimePreset(name) {
      const preset = LOCAL_RUNTIME_PRESETS[name];
      if (!preset) return;
      const setNumber = (id, value) => {
        const input = document.getElementById(id);
        if (input) input.value = value;
      };
      setNumber('runtimeNThreads', preset.n_threads);
      setNumber('runtimeNGpuLayers', preset.n_gpu_layers);
      setNumber('runtimeNCtx', preset.n_ctx);
      setNumber('runtimeNBatch', preset.n_batch);
      setNumber('runtimeNUbatch', preset.n_ubatch);
      const useMmap = document.getElementById('runtimeUseMmap');
      const useMlock = document.getElementById('runtimeUseMlock');
      const flashAttn = document.getElementById('runtimeFlashAttn');
      if (useMmap) useMmap.checked = preset.use_mmap;
      if (useMlock) useMlock.checked = preset.use_mlock;
      if (flashAttn) flashAttn.checked = preset.flash_attn;
    }

    function collectRuntimeSettings() {
      if (!settingsState) return {};
      const provider = settingsState.providers[providerSelect.value];
      if (!provider || !['gguf', 'ollama'].includes(provider.type)) return {};
      const numberValue = (id, fallback) => {
        const input = document.getElementById(id);
        const parsed = input ? Number.parseInt(input.value, 10) : Number.NaN;
        return Number.isFinite(parsed) ? parsed : fallback;
      };
      return {
        n_threads: numberValue('runtimeNThreads', 4),
        n_gpu_layers: numberValue('runtimeNGpuLayers', 0),
        n_ctx: numberValue('runtimeNCtx', 4096),
        n_batch: numberValue('runtimeNBatch', 512),
        n_ubatch: numberValue('runtimeNUbatch', 512),
        use_mmap: Boolean(document.getElementById('runtimeUseMmap')?.checked),
        use_mlock: Boolean(document.getElementById('runtimeUseMlock')?.checked),
        flash_attn: Boolean(document.getElementById('runtimeFlashAttn')?.checked)
      };
    }

    function renderProviderSettings() {
      if (!settingsState) return;
      const providerId = providerSelect.value;
      const provider = settingsState.providers[providerId];
      rebuildModelOptions(settingsModelSelect, provider.models || [], settingsState.default_model);
      providerSettings.innerHTML = '';
      const card = document.createElement('div');
      card.className = 'provider-card';
      card.innerHTML = `
        <div class="field">
          <label>Provider status</label>
          <div>${provider.configured ? 'Configured' : 'Not configured'}</div>
        </div>
        <div class="field">
          <label>Provider type</label>
          <div>${provider.type}</div>
        </div>
        <div class="field">
          <label>Base URL</label>
          <input type="text" value="${provider.base_url}" readonly>
        </div>
        <div class="field">
          <label>Models</label>
          <div>${(provider.models || []).join(', ') || 'No models saved yet'}</div>
        </div>
        ${runtimeSettingsHtml(provider)}
        <div class="field">
          <label for="providerKey">API key</label>
          <input id="providerKey" type="password" autocomplete="off" placeholder="${provider.configured ? 'Leave blank to keep current key' : 'Paste API key'}">
        </div>
        <div class="actions">
          <button id="discoverModels" type="button">Discover models</button>
        </div>
      `;
      providerSettings.appendChild(card);
      const discoverButton = document.getElementById('discoverModels');
      discoverButton.addEventListener('click', discoverModels);
      for (const button of card.querySelectorAll('[data-runtime-preset]')) {
        button.addEventListener('click', () => applyRuntimePreset(button.dataset.runtimePreset));
      }
    }

    async function loadSettings() {
      const response = await fetch('/settings');
      settingsState = await response.json();
      providerSelect.innerHTML = '';
      for (const [id, provider] of Object.entries(settingsState.providers)) {
        const option = document.createElement('option');
        option.value = id;
        option.textContent = provider.label;
        if (id === settingsState.default_provider) option.selected = true;
        providerSelect.appendChild(option);
      }
      renderProviderSettings();
      rebuildModelOptions(modelSelect, settingsState.providers[settingsState.default_provider].models, settingsState.default_model);
    }

    async function discoverModels() {
      const providerId = providerSelect.value;
      setSettingsStatus('Discovering models.');
      const response = await fetch(`/providers/${providerId}/discover`, { method: 'POST' });
      if (!response.ok) {
        setSettingsStatus(await response.text());
        return;
      }
      const data = await response.json();
      settingsState = data.settings;
      renderProviderSettings();
      rebuildModelOptions(modelSelect, settingsState.providers[settingsState.default_provider].models, settingsState.default_model);
      setSettingsStatus(data.models.length ? 'Models discovered.' : 'No models found.');
    }

    function renderLocalModels(data) {
      localModelRoots.textContent = `Scanned: ${(data.roots || []).join(', ') || 'No existing default roots found'}`;
      localModelList.innerHTML = '';
      for (const model of data.models || []) {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'memory-item';
        item.innerHTML = `<strong>${model.name}</strong>${model.type} · ${model.size_mb} MB<br>${model.path}`;
        item.addEventListener('click', () => {
          newProviderId.value = 'local_gguf';
          newProviderLabel.value = 'Local GGUF';
          newProviderType.value = 'gguf';
          newProviderModels.value = model.path;
          newProviderModelsPath.value = model.path.split(/[\\\\/]/).slice(0, -1).join('\\');
          setSettingsStatus('Local model selected. Save provider to use it.');
        });
        localModelList.appendChild(item);
      }
      if (!localModelList.children.length) {
        localModelList.innerHTML = '<div class="memory-item">No model files found in common locations.</div>';
      }
    }

    async function scanLocalModels() {
      setSettingsStatus('Scanning model folders.');
      const root = localModelRoot.value.trim();
      const response = root
        ? await fetch('/models/local/scan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ roots: [root], max_results: 200 })
          })
        : await fetch('/models/local');
      if (!response.ok) {
        setSettingsStatus(await response.text());
        return;
      }
      renderLocalModels(await response.json());
      setSettingsStatus('Local scan complete.');
    }

    function handleSseLine(eventName, data, assistantNode) {
      if (eventName === 'delta') {
        assistantNode.appendChild(document.createTextNode(data.content));
      } else if (eventName === 'assistant_replace') {
        assistantNode.textContent = data.content;
      } else if (TASK_EVENT_LABELS[eventName]) {
        renderTaskEvent(eventName, data);
      } else if (eventName === 'tool_call') {
        renderJsonBlock('Tool call', data);
      } else if (eventName === 'tool_result') {
        const toolName = data.tool || 'tool';
        const node = document.createElement('div');
        node.className = 'message assistant-msg';
        node.style.cursor = 'pointer';
        const role = document.createElement('div');
        role.className = 'role';
        role.textContent = `Subsession: ${toolName}`;
        const summary = document.createElement('div');
        summary.className = 'content';
        const exitCode = data.result && data.result.exit_code !== undefined ? data.result.exit_code : '?';
        const stderr = data.result && data.result.stderr ? (data.result.stderr.substring(0, 80)) : '';
        summary.textContent = `exit: ${exitCode}${stderr ? ' · ' + stderr : ''}`;
        node.appendChild(role);
        node.appendChild(summary);
        const detail = document.createElement('div');
        detail.style.display = 'none';
        detail.style.marginTop = '8px';
        detail.style.fontSize = '11px';
        detail.style.color = 'var(--gray-4)';
        detail.style.fontFamily = 'monospace';
        detail.style.whiteSpace = 'pre-wrap';
        detail.textContent = JSON.stringify(data, null, 2);
        node.appendChild(detail);
        node.addEventListener('click', () => { detail.style.display = detail.style.display === 'none' ? 'block' : 'none'; });
        output.appendChild(node);
        output.scrollTop = output.scrollHeight;
      } else if (eventName === 'approval_request') {
        renderApprovalRequest(data);
      } else if (eventName === 'error') {
        setStatus(data.message);
      } else if (eventName === 'done') {
        setStatus('Done.');
      }
    }

    function renderApprovalRequest(data) {
      const node = document.createElement('div');
      node.className = 'message approval-msg';
      const role = document.createElement('div');
      role.className = 'role';
      role.textContent = 'Approval Required';

      const tool = document.createElement('div');
      tool.style.marginBottom = '8px';
      tool.innerHTML = 'Tool: ';
      const toolName = document.createElement('strong');
      toolName.textContent = data.tool_name || 'unknown';
      tool.appendChild(toolName);

      const risk = document.createElement('div');
      risk.style.marginBottom = '12px';
      risk.textContent = data.risk_summary || 'Review this tool execution before approving.';

      const codeLabel = document.createElement('div');
      codeLabel.className = 'role';
      codeLabel.textContent = data.code ? 'Exact code to execute' : 'Arguments';

      const pre = document.createElement('pre');
      pre.style.fontSize = '11px';
      pre.style.background = 'var(--gray-1)';
      pre.style.padding = '8px';
      pre.textContent = data.code || JSON.stringify(data.arguments || {}, null, 2);

      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.style.marginTop = '12px';
      const approve = document.createElement('button');
      approve.className = 'approve-btn';
      approve.style.background = 'var(--white)';
      approve.style.color = 'var(--black)';
      approve.textContent = 'APPROVE';
      const reject = document.createElement('button');
      reject.className = 'reject-btn';
      reject.textContent = 'REJECT';
      actions.append(approve, reject);
      node.append(role, tool, risk, codeLabel, pre, actions);
      output.appendChild(node);
      output.scrollTop = output.scrollHeight;

      approve.onclick = async () => {
        node.remove();
        await fetch('/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ request_id: data.request_id })
        });
      };
      reject.onclick = async () => {
        node.remove();
        await fetch('/reject', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ request_id: data.request_id, reason: 'User rejected' })
        });
      };
    }

    async function saveCurrentSession() {
      if (messages.length < 2) {
        setStatus('Nothing to save yet.');
        return;
      }
      if (!activeSessionId) activeSessionId = createSessionId();
      setStatus('Saving session to memory...');
      try {
        const response = await fetch('/memory/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: activeSessionId, messages })
        });
        const data = await response.json();
        if (response.ok && data.status !== 'error') {
          activeSessionId = data.session_id || activeSessionId;
          setStatus('Session saved.');
          refreshMemories();
        } else {
          const errorMsg = data.message || data.detail || 'Unknown error';
          setStatus(`Failed to save: ${errorMsg}`);
        }
      } catch (error) {
        setStatus(`Network error: ${error.message}`);
      }
    }

    async function sendMessage(text) {
      if (currentChatAbort) {
        currentChatAbort.abort();
      }
      const abort = new AbortController();
      currentChatAbort = abort;

      messages.push({ role: 'user', content: text });
      addTextMessage('User', text);
      const assistantNode = addTextMessage('Ouroboros', '');
      sendButton.disabled = true;
      setStatus('Thinking.');

      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages,
          model: modelSelect.value,
          provider: providerSelect.value || 'pollinations',
          context_files: contextFiles,
          auto_approve: autoApproveToggle.checked
        }),
        signal: abort.signal,
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let eventName = 'message';
      let assistantText = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop() || '';
        for (const part of parts) {
          const lines = part.split('\n');
          let dataLine = '';
          for (const line of lines) {
            if (line.startsWith('event: ')) eventName = line.slice(7);
            if (line.startsWith('data: ')) dataLine = line.slice(6);
          }
          if (!dataLine) continue;
          const data = JSON.parse(dataLine);
          if (eventName === 'delta') assistantText += data.content;
          handleSseLine(eventName, data, assistantNode);
        }
      }

      if (abort.signal.aborted) {
        sendButton.disabled = false;
        return;
      }
      messages.push({ role: 'assistant', content: assistantText });
      try {
        await persistSessionArchive();
      } catch (error) {
        setStatus(`Session archive failed: ${error.message}`);
      }
      sendButton.disabled = false;
      promptInput.focus();
    }

    composer.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = promptInput.value.trim();
      if (!text || sendButton.disabled) return;
      promptInput.value = '';
      try {
        await sendMessage(text);
      } catch (error) {
        setStatus(error.message || String(error));
        sendButton.disabled = false;
      }
    });

    promptInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const form = new FormData();
      form.append('file', file);
      setStatus('Uploading file.');
      const response = await fetch('/upload', { method: 'POST', body: form });
      if (!response.ok) {
        setStatus(await response.text());
        return;
      }
      const item = await response.json();
      contextFiles.push(item);
      addChip(item);
      setStatus('Context file added.');
      fileInput.value = '';
    });

    toggleMemory.addEventListener('click', () => {
      const app = document.querySelector('.app');
      const isOpening = app.classList.contains('sidebar-collapsed');
      app.classList.toggle('sidebar-collapsed');
      if (isOpening) {
        refreshMemories();
      }
    });
    saveSession.addEventListener('click', saveCurrentSession);
    newSessionButton.addEventListener('click', () => startNewSession(true));
    previousSessionButton.addEventListener('click', () => navigateSession(1));
    nextSessionButton.addEventListener('click', () => navigateSession(-1));
    openSettings.addEventListener('click', async () => {
      await loadSettings();
      settingsPanel.classList.add('open');
      settingsPanel.setAttribute('aria-hidden', 'false');
    });
    closeSettings.addEventListener('click', () => {
      settingsPanel.classList.remove('open');
      settingsPanel.setAttribute('aria-hidden', 'true');
    });
    providerSelect.addEventListener('change', renderProviderSettings);
    scanLocalModelsButton.addEventListener('click', scanLocalModels);
    saveProviderButton.addEventListener('click', async () => {
      const models = newProviderModels.value.split(',').map(item => item.trim()).filter(Boolean);
      const response = await fetch('/providers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: newProviderId.value.trim(),
          label: newProviderLabel.value.trim(),
          type: newProviderType.value,
          base_url: newProviderBaseUrl.value.trim(),
          api_key: newProviderKey.value.trim(),
          models,
          models_path: newProviderModelsPath.value.trim()
        })
      });
      if (!response.ok) {
        setSettingsStatus(await response.text());
        return;
      }
      settingsState = await response.json();
      newProviderId.value = '';
      newProviderLabel.value = '';
      newProviderBaseUrl.value = '';
      newProviderModels.value = '';
      newProviderModelsPath.value = '';
      newProviderKey.value = '';
      await loadSettings();
      setSettingsStatus('Provider saved.');
    });
    settingsForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const providerId = providerSelect.value;
      const keyInput = document.getElementById('providerKey');
      const response = await fetch('/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          default_provider: providerId,
          default_model: settingsModelSelect.value,
          provider_keys: {
            [providerId]: keyInput ? keyInput.value.trim() : ''
          },
          runtime_settings: collectRuntimeSettings()
        })
      });
      if (!response.ok) {
        setSettingsStatus(await response.text());
        return;
      }
      settingsState = await response.json();
      rebuildModelOptions(modelSelect, settingsState.providers[providerId].models, settingsState.default_model);
      renderProviderSettings();
      setSettingsStatus('Settings saved.');
    });
    refreshMemory.addEventListener('click', refreshMemories);
    // Delegated click for JSON block collapse/expand
    output.addEventListener('click', function(e) {
      const toggle = e.target.closest('.json-toggle');
      if (!toggle) return;
      const id = toggle.dataset.target;
      const pre = document.getElementById(id);
      if (!pre) return;
      const hidden = pre.style.display === 'none';
      pre.style.display = hidden ? '' : 'none';
      toggle.firstChild.textContent = hidden ? '[\u002D]' : '[\u002B]';
    });
    // Auto-resize textarea
    promptInput.addEventListener('input', () => {
      promptInput.style.height = 'auto';
      promptInput.style.height = Math.min(promptInput.scrollHeight, 200) + 'px';
    });
    loadSettings().catch(() => {});
    startNewSession(false);
    refreshMemories();
  </script>
</body>
</html>
